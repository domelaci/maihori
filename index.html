<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mai Hori – Napi horoszkóp</title>
  <meta name="description" content="Napi horoszkóp mind a 12 csillagjegyre. Ingyenes, friss, minden reggel megújul.">
  <meta property="og:title" content="Mai Hori – Napi horoszkóp">
  <meta property="og:description" content="Napi horoszkóp mind a 12 csillagjegyre. Ingyenes, friss, minden reggel megújul.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://maihori.hu/">
  <meta property="og:image" content="https://maihori.hu/og-image.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Mai Hori – Napi horoszkóp">
  <meta name="twitter:description" content="Napi horoszkóp mind a 12 csillagjegyre.">
  <meta name="twitter:image" content="https://maihori.hu/og-image.png">
  <link rel="canonical" href="https://maihori.hu/">
  <!-- Google Search Console: replace content with your verification code from search.google.com/search-console -->
  <meta name="google-site-verification" content="PASTE_GSC_CODE_HERE">
  <!-- Google Analytics 4: replace G-XXXXXXXXXX with your Measurement ID from analytics.google.com -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-XXXXXXXXXX');
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:       #09071a;
      --surface:  #120f28;
      --surface2: #1a1640;
      --accent:   #8b5cf6;
      --accent2:  #a78bfa;
      --text:     #e2dff5;
      --muted:    #7c78a0;
      --border:   #2a2550;
      --glow:     rgba(139, 92, 246, 0.25);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-weight: 300;
      line-height: 1.7;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── Stars background ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(1px 1px at 10% 20%, rgba(255,255,255,0.6) 0%, transparent 100%),
        radial-gradient(1px 1px at 30% 70%, rgba(255,255,255,0.4) 0%, transparent 100%),
        radial-gradient(1px 1px at 50% 10%, rgba(255,255,255,0.5) 0%, transparent 100%),
        radial-gradient(1px 1px at 70% 40%, rgba(255,255,255,0.3) 0%, transparent 100%),
        radial-gradient(1px 1px at 80% 80%, rgba(255,255,255,0.5) 0%, transparent 100%),
        radial-gradient(1px 1px at 20% 90%, rgba(255,255,255,0.4) 0%, transparent 100%),
        radial-gradient(1px 1px at 90% 60%, rgba(255,255,255,0.3) 0%, transparent 100%),
        radial-gradient(1px 1px at 45% 55%, rgba(255,255,255,0.6) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 65% 25%, rgba(255,255,255,0.5) 0%, transparent 100%),
        radial-gradient(1px 1px at 15% 50%, rgba(255,255,255,0.3) 0%, transparent 100%);
      pointer-events: none;
      z-index: 0;
    }

    body > * { position: relative; z-index: 1; }

    /* ── Header ── */
    header {
      text-align: center;
      padding: 3rem 1rem 2rem;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2rem, 6vw, 3.5rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #c4b5fd, #8b5cf6, #6d28d9);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .tagline {
      color: var(--muted);
      font-size: 0.95rem;
      margin-top: 0.4rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      font-weight: 400;
    }

    .date-display {
      margin-top: 1rem;
      font-size: 0.9rem;
      color: var(--accent2);
      font-weight: 400;
    }

    /* ── Main layout ── */
    main { max-width: 1100px; margin: 0 auto; padding: 2.5rem 1.25rem 4rem; }

    /* ── Sign grid ── */
    .section-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
      margin-bottom: 1.25rem;
      font-weight: 500;
    }

    .signs-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.75rem;
      margin-bottom: 2.5rem;
    }

    .sign-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.1rem 0.75rem;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, box-shadow 0.2s, transform 0.15s;
      user-select: none;
    }

    .sign-card:hover {
      border-color: var(--accent);
      box-shadow: 0 0 16px var(--glow);
      transform: translateY(-2px);
    }

    .sign-card.active {
      border-color: var(--accent);
      background: var(--surface2);
      box-shadow: 0 0 24px var(--glow);
    }

    .sign-symbol {
      font-size: 1.8rem;
      line-height: 1;
      margin-bottom: 0.4rem;
    }

    .sign-name {
      font-family: 'Playfair Display', serif;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text);
    }

    .sign-dates {
      font-size: 0.7rem;
      color: var(--muted);
      margin-top: 0.2rem;
    }

    .sign-element {
      display: inline-block;
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 0.15rem 0.45rem;
      border-radius: 4px;
      margin-top: 0.5rem;
      font-weight: 500;
    }

    .el-tűz  { background: rgba(239,68,68,0.15); color: #f87171; }
    .el-föld { background: rgba(34,197,94,0.15);  color: #86efac; }
    .el-levegő { background: rgba(250,204,21,0.15); color: #fde68a; }
    .el-víz  { background: rgba(59,130,246,0.15); color: #93c5fd; }

    /* ── Reading area ── */
    .reading-area {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2.5rem 2rem;
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 0.35s, transform 0.35s;
      min-height: 120px;
    }

    .reading-area.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .reading-header {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.5rem;
      padding-bottom: 1.25rem;
      border-bottom: 1px solid var(--border);
    }

    .reading-symbol {
      font-size: 2.5rem;
      line-height: 1;
    }

    .reading-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.4rem, 4vw, 2rem);
      font-weight: 700;
      color: var(--text);
    }

    .reading-subtitle {
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 0.2rem;
    }

    .reading-text {
      font-size: 1.05rem;
      line-height: 1.85;
      color: var(--text);
    }

    .reading-text p + p { margin-top: 1.2rem; }

    .empty-state {
      text-align: center;
      color: var(--muted);
      padding: 2rem;
      font-size: 1rem;
    }

    .empty-icon {
      font-size: 2.5rem;
      display: block;
      margin-bottom: 0.75rem;
      opacity: 0.5;
    }

    /* ── Footer ── */
    footer {
      text-align: center;
      padding: 2rem 1rem;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.8rem;
    }

    /* ── Loading state ── */
    .loading {
      text-align: center;
      padding: 3rem;
      color: var(--muted);
    }

    /* ── Error banner ── */
    .error-banner {
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.3);
      border-radius: 8px;
      padding: 1rem 1.5rem;
      color: #f87171;
      margin-bottom: 1.5rem;
      font-size: 0.9rem;
    }

    .gender-toggle {
      display: flex; gap: 0.5rem; margin-bottom: 1.75rem;
    }
    .gender-btn {
      padding: 0.5rem 1.5rem; border-radius: 30px; font-size: 0.9rem;
      font-family: inherit; cursor: pointer; font-weight: 500;
      border: 2px solid rgba(255,255,255,0.15);
      background: transparent; color: var(--text2);
      transition: all 0.2s;
    }
    .gender-btn.active {
      background: var(--accent); color: #fff; border-color: var(--accent);
    }
    .gender-btn:hover:not(.active) { border-color: var(--accent); color: var(--accent); }

    .sign-meta {
      display: flex; gap: 0.5rem; flex-wrap: wrap; margin: 0.75rem 0 1.25rem;
    }
    .meta-pill {
      font-size: 0.75rem; padding: 3px 10px; border-radius: 20px;
      background: rgba(255,255,255,0.06); color: var(--text2);
      border: 1px solid rgba(255,255,255,0.1);
    }
    .sign-description {
      font-size: 0.9rem; color: var(--text2); line-height: 1.7;
      margin-bottom: 1.5rem; font-style: italic;
      padding-bottom: 1.25rem; border-bottom: 1px solid rgba(255,255,255,0.07);
    }
    .reading-label {
      font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.1em;
      color: var(--accent2); font-weight: 500; margin-bottom: 0.75rem;
    }

    /* ── Responsive ── */
    @media (max-width: 700px) {
      .signs-grid { grid-template-columns: repeat(3, 1fr); gap: 0.6rem; }
      .sign-card  { padding: 0.9rem 0.5rem; }
      .sign-symbol { font-size: 1.5rem; }
      .sign-name   { font-size: 0.85rem; }
      .reading-area { padding: 1.5rem 1.25rem; }
    }

    @media (max-width: 420px) {
      .signs-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">Mai Hori ✦</div>
  <div class="tagline">Napi horoszkóp</div>
  <div class="date-display" id="date-display"></div>
</header>

<main>
  <div id="error-container"></div>

  <div class="gender-toggle">
    <button class="gender-btn active" id="btn-ferfi" onclick="setGender('ferfi')">♂ Férfi</button>
    <button class="gender-btn" id="btn-no" onclick="setGender('no')">♀ Nő</button>
  </div>

  <div class="section-label">Válaszd ki a csillagjegyed</div>
  <div class="signs-grid" id="signs-grid">
    <div class="loading">⟳ Betöltés...</div>
  </div>

  <div class="reading-area" id="reading-area">
    <div class="empty-state">
      <span class="empty-icon">✦</span>
      Kattints egy csillagjegyre a mai horoszkópod megtekintéséhez
    </div>
  </div>
</main>

<footer>
  <p>© <span id="year"></span> Mai Hori &mdash; minden reggel friss horoszkóp</p>
</footer>

<script>
  const SIGNS = [
    { id: 'kos',      name: 'Kos',      symbol: '♈', dates: 'márc. 21. – ápr. 19.',  element: 'tűz',     planet: 'Mars',      traits: ['energikus','bátor','impulzív','versenyszellemű'],   description: 'Bátor, elszánt és tele energiával. A Kos az állatöv első jegye – természetes vezető, aki szeret elsőként tenni meg mindent. Lelkesedése és határozott egyénisége mindenkit magával ragad.' },
    { id: 'bika',     name: 'Bika',     symbol: '♉', dates: 'ápr. 20. – máj. 20.',   element: 'föld',    planet: 'Vénusz',    traits: ['kitartó','megbízható','érzéki','türelmes'],          description: 'Megbízható, türelmes és a szépség igazi szerelmese. A Bika értékeli az élet stabil, kényelmes oldalát, és páratlan kitartással ragaszkodik ahhoz, amibe belefog. Hűsége minden körülmények között megingathatatlan.' },
    { id: 'ikrek',    name: 'Ikrek',    symbol: '♊', dates: 'máj. 21. – jún. 20.',   element: 'levegő',  planet: 'Merkúr',    traits: ['szellemes','sokoldalú','kommunikatív','kíváncsi'],   description: 'Kíváncsi, szellemes és rendkívül sokoldalú. Az Ikrek gondolkodása villámgyors, kommunikációja brilliáns. Szórakoztató társak, akik mindig friss szemszöget és új ötleteket hoznak minden helyzetbe.' },
    { id: 'rak',      name: 'Rák',      symbol: '♋', dates: 'jún. 21. – júl. 22.',   element: 'víz',     planet: 'Hold',      traits: ['gondoskodó','intuitív','érzelmes','védelmező'],      description: 'Érzékeny, intuitív és mélyen empatikus. A Rák a család és az otthon védelmezője, aki mélyen kötődik szeretteihez. Gondoskodó természete mindenkit melegséggel és biztonságérzettel tölt el.' },
    { id: 'oroszlan', name: 'Oroszlán', symbol: '♌', dates: 'júl. 23. – aug. 22.',   element: 'tűz',     planet: 'Nap',       traits: ['karizmatikus','nagylelkű','büszke','kreatív'],       description: 'Karizmatikus, nagylelkű és természetes módon a figyelem középpontja. Az Oroszlán ragyogni született – büszke és határozott, de szíve arany, és barátaiért képes mindent feláldozni.' },
    { id: 'szuz',     name: 'Szűz',     symbol: '♍', dates: 'aug. 23. – szept. 22.', element: 'föld',    planet: 'Merkúr',    traits: ['precíz','analitikus','segítőkész','perfekcionista'], description: 'Analitikus, precíz és rendkívül megbízható. A Szűz figyel a részletekre, és mindig a tökéletességre törekszik. Munkájának minősége kiemelkedő, és segítőkészsége minden helyzetben megnyilvánul.' },
    { id: 'merleg',   name: 'Mérleg',   symbol: '♎', dates: 'szept. 23. – okt. 22.', element: 'levegő',  planet: 'Vénusz',    traits: ['harmonikus','igazságos','szociális','diplomatikus'], description: 'Harmonikus, igazságos és esztétikus érzékkel megáldott. A Mérleg a kapcsolatok mestere, aki mindent egyensúlyban szeretne tartani. Diplomáciai érzéke és igazságszeretete páratlan.' },
    { id: 'skorpio',  name: 'Skorpió',  symbol: '♏', dates: 'okt. 23. – nov. 21.',   element: 'víz',     planet: 'Plútó',     traits: ['intenzív','szenvedélyes','elszánt','mélységes'],     description: 'Intenzív, elszánt és mélyen érzékeny. A Skorpió nem ismer félmegoldásokat – mindent teljesen átél. Titokzatos belső ereje és végtelen szenvedélye mindenkit lenyűgöz.' },
    { id: 'nyilas',   name: 'Nyilas',   symbol: '♐', dates: 'nov. 22. – dec. 21.',   element: 'tűz',     planet: 'Jupiter',   traits: ['optimista','kalandvágyó','őszinte','filozofikus'],   description: 'Optimista, kalandvágyó és filozofikus beállítottságú. A Nyilas szabad lélek, aki szeret felfedezni – fizikailag és szellemileg egyaránt. Nyíltsága és humora mindenkit megfertőz.' },
    { id: 'bak',      name: 'Bak',      symbol: '♑', dates: 'dec. 22. – jan. 19.',   element: 'föld',    planet: 'Szaturnusz', traits: ['ambiciózus','fegyelmezett','kitartó','felelősségteljes'], description: 'Ambiciózus, fegyelmezett és rendkívül kitartó. A Bak tudja, mit akar, és nem rest keményen megdolgozni érte. Komolyan veszi kötelességeit, de mélyen belül meleg szív dobog benne.' },
    { id: 'vizonto',  name: 'Vízöntő',  symbol: '♒', dates: 'jan. 20. – febr. 18.',  element: 'levegő',  planet: 'Uránusz',   traits: ['eredeti','humanista','független','innovatív'],       description: 'Eredeti, humanista és előremutató gondolkodású. A Vízöntő a jövőbe lát, és szeret a megszokottól eltérő utakat járni. Barátai körében ő a legkülönlegesebb – saját szabályait alkotja.' },
    { id: 'halak',    name: 'Halak',    symbol: '♓', dates: 'febr. 19. – márc. 20.', element: 'víz',     planet: 'Neptunusz', traits: ['empatikus','kreatív','intuitív','álmodozó'],        description: 'Álmodozó, intuitív és rendkívül empatikus. A Halak a legmisztikusabb jegy – könnyen átérzik mások érzelmeit, és mélyen kreatívak. Képzeletük határtalan, és a világ szépségét mindenkinél mélyebben érzékelik.' },
  ];

  const MONTHS = ['január','február','március','április','május','június',
                  'július','augusztus','szeptember','október','november','december'];

  let todayData = null;
  let activeSign   = localStorage.getItem('maihori-sign')   || null;
  let activeGender = localStorage.getItem('maihori-gender') || 'ferfi';

  function setGender(g) {
    activeGender = g;
    localStorage.setItem('maihori-gender', g);
    document.getElementById('btn-ferfi').classList.toggle('active', g === 'ferfi');
    document.getElementById('btn-no').classList.toggle('active', g === 'no');
    if (activeSign) showReading(activeSign);
  }

  function formatDate(d) {
    return `${d.getFullYear()}. ${MONTHS[d.getMonth()]} ${d.getDate()}.`;
  }

  function showError(msg) {
    document.getElementById('error-container').innerHTML =
      `<div class="error-banner">${msg}</div>`;
  }

  function renderGrid() {
    const grid = document.getElementById('signs-grid');
    grid.innerHTML = SIGNS.map(s => `
      <div class="sign-card${activeSign === s.id ? ' active' : ''}"
           data-id="${s.id}" role="button" tabindex="0"
           aria-label="${s.name} horoszkóp">
        <div class="sign-symbol">${s.symbol}</div>
        <div class="sign-name">${s.name}</div>
        <div class="sign-dates">${s.dates}</div>
        <div class="sign-element el-${s.element}">${s.element}</div>
      </div>
    `).join('');

    grid.querySelectorAll('.sign-card').forEach(card => {
      card.addEventListener('click', () => selectSign(card.dataset.id));
      card.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') selectSign(card.dataset.id);
      });
    });
  }

  function selectSign(id) {
    activeSign = id;
    localStorage.setItem('maihori-sign', id);
    renderGrid();
    showReading(id);
  }

  function showReading(id) {
    const area   = document.getElementById('reading-area');
    const sign   = SIGNS.find(s => s.id === id);
    const genderData = todayData ? (todayData[activeGender] || todayData) : null;
    const text   = genderData ? genderData[id] : null;

    area.classList.remove('visible');

    setTimeout(() => {
      if (!text) {
        area.innerHTML = `<div class="empty-state">
          <span class="empty-icon">✦</span>
          A mai horoszkóp még nem érhető el. Nézz vissza reggel!
        </div>`;
      } else {
        const paragraphs = text.split(/\n+/).filter(p => p.trim())
          .map(p => `<p>${p}</p>`).join('');
        const traits = (sign.traits || []).map(t => `<span class="meta-pill">${t}</span>`).join('');
        area.innerHTML = `
          <div class="reading-header">
            <div class="reading-symbol">${sign.symbol}</div>
            <div>
              <div class="reading-title">${sign.name}</div>
              <div class="reading-subtitle">${sign.dates} &mdash; ${sign.element} &mdash; ☿ ${sign.planet || ''}</div>
            </div>
          </div>
          ${sign.description ? `<div class="sign-description">${sign.description}</div>` : ''}
          ${traits ? `<div class="sign-meta">${traits}</div>` : ''}
          <div class="reading-label">Mai horoszkóp</div>
          <div class="reading-text">${paragraphs}</div>
        `;
      }
      area.classList.add('visible');
    }, 150);
  }

  async function init() {
    setGender(activeGender);
    const today = new Date();
    document.getElementById('date-display').textContent = formatDate(today);
    document.getElementById('year').textContent = today.getFullYear();

    const todayStr = today.toISOString().split('T')[0];

    try {
      const res  = await fetch('horoscopes.json?v=' + todayStr);
      const data = await res.json();
      const entry = data.find(d => d.date === todayStr) || data[data.length - 1];
      if (entry) {
        todayData = entry;
        const entryDate = new Date(entry.date + 'T12:00:00');
        const isToday = entry.date === todayStr;
        document.getElementById('date-display').textContent =
          (isToday ? 'Mai horoszkóp – ' : 'Legutóbbi horoszkóp – ') + formatDate(entryDate);
      }
    } catch (e) {
      showError('Nem sikerült betölteni a horoszkópot. Kérjük, próbáld újra később.');
    }

    renderGrid();

    if (activeSign) {
      showReading(activeSign);
    }
  }

  init();
</script>
</body>
</html>
